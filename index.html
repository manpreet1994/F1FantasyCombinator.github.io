<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Fantasy Combinator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.10.3/Recharts.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: #cbd5e1;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Header */
        header {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 1.5rem 1rem;
            border-bottom: 1px solid #1e293b;
        }

        .race-info {
            font-size: 0.875rem;
        }

        .race-info p:first-child {
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .race-info.last {
            text-align: left;
        }

        .race-info.upcoming {
            text-align: right;
        }

        .race-info .race-name {
            font-weight: bold;
            color: #f1f5f9;
        }

        .race-info.upcoming .race-name {
            color: #38bdf8;
        }

        .header-center {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: bold;
            color: #f1f5f9;
            font-family: 'Titillium Web', sans-serif;
        }

        h1 .highlight {
            color: #38bdf8;
        }

        .refresh-btn {
            padding: 0.5rem;
            border-radius: 9999px;
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            transition: all 0.2s;
        }

        .refresh-btn:hover {
            background: #1e293b;
            color: #f1f5f9;
        }

        .refresh-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .refresh-btn.spinning {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Main Content */
        main {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.5rem 1rem;
        }

        /* Navigation */
        nav {
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-container {
            display: flex;
            gap: 0.25rem;
            background: rgba(30, 41, 59, 0.5);
            padding: 0.25rem;
            border-radius: 0.5rem;
        }

        .nav-btn {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #cbd5e1;
        }

        .nav-btn:hover {
            background: rgba(51, 65, 85, 0.5);
        }

        .nav-btn.active {
            background: #0ea5e9;
            color: white;
        }

        /* Banner */
        .stale-banner {
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid rgba(250, 204, 21, 0.3);
            color: #fde047;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .stale-banner strong {
            font-weight: bold;
        }

        .stale-banner .close-btn {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            padding: 0.75rem 1rem;
            background: none;
            border: none;
            color: #fef08a;
            cursor: pointer;
        }

        /* Card */
        .card {
            background: rgba(30, 41, 59, 0.5);
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #334155;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #f1f5f9;
        }

        .mode-toggle {
            display: flex;
            gap: 0.25rem;
            background: rgba(15, 23, 42, 0.7);
            padding: 0.25rem;
            border-radius: 0.5rem;
        }

        .mode-btn {
            padding: 0.25rem 0.75rem;
            font-size: 0.875rem;
            border-radius: 0.375rem;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            background: transparent;
            color: #cbd5e1;
        }

        .mode-btn:hover {
            background: rgba(51, 65, 85, 0.5);
        }

        .mode-btn.active {
            background: #0ea5e9;
            color: white;
        }

        /* Table */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            border-bottom: 1px solid #334155;
        }

        th {
            padding: 0.75rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        th button {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.2s;
        }

        th button:hover {
            color: #e2e8f0;
        }

        th button.sorted {
            color: #e2e8f0;
        }

        th.text-right {
            text-align: right;
        }

        th.text-right button {
            margin-left: auto;
        }

        tbody tr {
            border-bottom: 1px solid #1e293b;
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: rgba(30, 41, 59, 0.6);
        }

        td {
            padding: 0.75rem;
            white-space: nowrap;
        }

        td.text-right {
            text-align: right;
        }

        td.driver-name {
            font-weight: 500;
            color: #f1f5f9;
        }

        td.price {
            color: #22d3ee;
        }

        td.points {
            font-weight: 600;
            font-size: 1.125rem;
            color: #f1f5f9;
        }

        /* Comparison View */
        .comparison-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .selectors {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .selector {
            flex: 1;
            min-width: 200px;
        }

        .selector label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: #94a3b8;
            margin-bottom: 0.25rem;
        }

        .selector select {
            width: 100%;
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            border-radius: 0.375rem;
            padding: 0.5rem;
            font-size: 1rem;
        }

        .selector select:focus {
            outline: none;
            border-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.8);
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
        }

        .stat-card .label {
            font-size: 0.875rem;
            color: #94a3b8;
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }

        .stat-card .value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f1f5f9;
        }

        .stat-card .value.price {
            color: #22d3ee;
        }

        .chart-section h3 {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: #e2e8f0;
        }

        .chart-container {
            width: 100%;
            height: 320px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 0.375rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: #94a3b8;
        }

        /* Prediction View */
        .prediction-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: rgba(30, 41, 59, 0.5);
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            min-height: 400px;
        }

        .prediction-icon {
            width: 4rem;
            height: 4rem;
            color: #38bdf8;
            margin-bottom: 1rem;
        }

        .prediction-container h2 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f1f5f9;
            margin-bottom: 0.5rem;
        }

        .prediction-container p {
            color: #94a3b8;
            max-width: 28rem;
            text-align: center;
        }

        /* Loading */
        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 16rem;
        }

        .spinner {
            width: 4rem;
            height: 4rem;
            border: 2px solid #1e293b;
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .error-message {
            text-align: center;
            padding: 2rem;
            color: #94a3b8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                grid-template-columns: 1fr;
                gap: 1rem;
            }

            .race-info.last,
            .race-info.upcoming {
                text-align: center;
            }

            h1 {
                font-size: 1.5rem;
            }

            .comparison-header {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="race-info last">
            <p>LAST RACE</p>
            <p class="race-name" id="lastRace">Loading...</p>
            <p id="lastRaceDate"></p>
        </div>
        
        <div class="header-center">
            <h1>F1 <span class="highlight">Fantasy Combinator</span></h1>
            <button class="refresh-btn" id="refreshBtn" onclick="loadData()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0011.664 0M6.182 6.182a8.25 8.25 0 0111.664 0m0 0l3.181-3.183m-3.181 3.183V4.5" />
                </svg>
            </button>
        </div>

        <div class="race-info upcoming">
            <p>UPCOMING RACE</p>
            <p class="race-name" id="upcomingRace">Loading...</p>
            <p id="upcomingDate"></p>
        </div>
    </header>

    <main class="container">
        <nav>
            <div class="nav-container">
                <button class="nav-btn active" data-view="exploration" onclick="setView('exploration')">Exploration</button>
                <button class="nav-btn" data-view="comparison" onclick="setView('comparison')">Comparison</button>
                <button class="nav-btn" data-view="prediction" onclick="setView('prediction')">Prediction</button>
            </div>
        </nav>

        <div id="staleBanner" class="stale-banner" style="display: none;">
            <strong>Stale Data!</strong>
            <span> Could not fetch the latest fantasy data. Showing cached information.</span>
            <button class="close-btn" onclick="document.getElementById('staleBanner').style.display='none'">
                <svg width="24" height="24" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M14.348 14.849a1.2 1.2 0 0 1-1.697 0L10 11.819l-2.651 3.029a1.2 1.2 0 1 1-1.697-1.697l2.758-3.15-2.759-3.152a1.2 1.2 0 1 1 1.697-1.697L10 8.183l2.651-3.031a1.2 1.2 0 1 1 1.697 1.697l-2.758 3.152 2.758 3.15a1.2 1.2 0 0 1 0 1.698z"/>
                </svg>
            </button>
        </div>

        <div id="viewContainer"></div>
    </main>

    <script>
        // Global state
        let fantasyData = null;
        let currentView = 'exploration';
        let sortConfig = { drivers: { key: 'season_score', direction: 'desc' }, constructors: { key: 'season_score', direction: 'desc' } };

        // Initialize
        loadData();

        // Data loading functions
        async function loadData() {
            const refreshBtn = document.getElementById('refreshBtn');
            refreshBtn.classList.add('spinning');
            refreshBtn.disabled = true;

            try {
                const configResponse = await fetch('config.json');
                const config = await configResponse.json();
                const year = config.year;

                const fantasyUrlTemplate = config.api.baseUrl + config.api.fantasyDataPath;
                const scheduleUrlTemplate = config.api.baseUrl + config.api.raceSchedulePath;
                const avgPointsUrlTemplate = config.api.baseUrl + config.api.avgPointsPath;

                const [dataResult, raceSchedule, avgPointsResult] = await Promise.all([
                    fetchFantasyData(fantasyUrlTemplate, year),
                    fetchRaceSchedule(scheduleUrlTemplate, year),
                    fetchAvgPoints(avgPointsUrlTemplate, year)
                ]);

                fantasyData = processFantasyData(dataResult.data, avgPointsResult.data);
                
                if (dataResult.isStale || avgPointsResult.isStale) {
                    document.getElementById('staleBanner').style.display = 'block';
                }

                updateRaceInfo(raceSchedule);
                renderView();
            } catch (error) {
                console.error('Error loading data:', error);
            } finally {
                refreshBtn.classList.remove('spinning');
                refreshBtn.disabled = false;
            }
        }

        async function fetchFantasyData(urlTemplate, year) {
            const url = urlTemplate.replace('{year}', year);
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return { data: data, isStale: false };
            } catch (error) {
                console.error('Failed to fetch fantasy data:', error);
                // Fallback to sample data if API fails
                return { data: {}, isStale: true }; // Return empty object on failure before processing
            }
        }

        async function fetchAvgPoints(urlTemplate, year) {
            const url = urlTemplate.replace('{year}', year);
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                return { data: data, isStale: false };
            } catch (error) {
                console.error('Failed to fetch average points data:', error);
                return { data: {}, isStale: true };
            }
        }

        async function fetchRaceSchedule(urlTemplate, year) {
            const url = urlTemplate.replace('{year}', year);
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const scheduleData = await response.json();
                const schedule = scheduleData.races;

                // Sort schedule by date just in case it's not ordered
                schedule.sort((a, b) => new Date(a.date) - new Date(b.date));

                const now = new Date();
                let lastRace = null;
                let upcomingRace = null;

                for (const race of schedule) {
                    const raceDate = new Date(race.date + 'T' + (race.time || '23:59:59Z'));
                    if (raceDate < now) {
                        lastRace = { name: race.race_name, date: race.date };
                    } else if (!upcomingRace) {
                        upcomingRace = { name: race.race_name, date: race.date };
                    }
                }

                return { currentRace: lastRace, upcomingRace: upcomingRace };
            } catch (error) {
                console.error('Failed to fetch race schedule:', error);
                return { currentRace: { name: 'Error fetching', date: '' }, upcomingRace: { name: 'Error fetching', date: '' } };
            }
        }

        function updateRaceInfo(raceInfo) {
            const lastRaceEl = document.getElementById('lastRace');
            const upcomingRaceEl = document.getElementById('upcomingRace');
            const upcomingDateEl = document.getElementById('upcomingDate');
            const lastRaceDateEl = document.getElementById('lastRaceDate');

            if (raceInfo.currentRace) {
                lastRaceEl.textContent = raceInfo.currentRace.name;
                const [year, month, day] = raceInfo.currentRace.date.split('-');
                const date = new Date(year, month - 1, day);
                lastRaceDateEl.textContent = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            } else {
                lastRaceEl.textContent = 'N/A';
                lastRaceDateEl.textContent = '';
            }

            if (raceInfo.upcomingRace) {
                upcomingRaceEl.textContent = raceInfo.upcomingRace.name;
                // Split the date string to avoid timezone issues with new Date()
                const [year, month, day] = raceInfo.upcomingRace.date.split('-');
                const date = new Date(year, month - 1, day);
                upcomingDateEl.textContent = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            } else {
                upcomingRaceEl.textContent = 'N/A';
                upcomingDateEl.textContent = 'TBD';
            }
        }

        function processFantasyData(raceScoresData, avgPointsData) {
            if (!avgPointsData) {
                return { drivers: [], constructors: [] };
            }
        
            const processItems = (itemsObject) => {
                if (!itemsObject) return [];
                return Object.entries(itemsObject).map(([id, data]) => ({
                    id: id,
                    display_name: data.display_name || id, // Fallback to ID if display_name is not present
                    price: data.latest_price,
                    season_score: data.avg_score,
                    scores_by_race: {} // Keeping this for compatibility with comparison view
                }));
            };
        
            // The user-provided format seems to be just for drivers.
            // Assuming avgPointsData is the object for drivers.
            // If constructors have a similar structure, they would be under a 'constructors' key.
            const drivers = processItems(avgPointsData.drivers || avgPointsData);
            const constructors = processItems(avgPointsData.constructors);
        
            return {
                drivers,
                constructors
            };
        }

        // View management
        function setView(view) {
            currentView = view;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                if (btn.dataset.view === view) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderView();
        }

        function renderView() {
            const container = document.getElementById('viewContainer');
            
            if (!fantasyData) {
                container.innerHTML = '<div class="loading-container"><div class="spinner"></div></div>';
                return;
            }

            switch (currentView) {
                case 'exploration':
                    renderExplorationView(container);
                    break;
                case 'comparison':
                    renderComparisonView(container);
                    break;
                case 'prediction':
                    renderPredictionView(container);
                    break;
            }
        }

        // Exploration View
        function renderExplorationView(container) {
            const mode = container.dataset.explorationMode || 'drivers';
            
            const html = `
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">${mode === 'drivers' ? 'Drivers' : 'Constructors'}</h2>
                        <div class="mode-toggle">
                            <button class="mode-btn ${mode === 'drivers' ? 'active' : ''}" onclick="toggleExplorationMode('drivers')">Drivers</button>
                            <button class="mode-btn ${mode === 'constructors' ? 'active' : ''}" onclick="toggleExplorationMode('constructors')">Constructors</button>
                        </div>
                    </div>
                    <div id="explorationTable"></div>
                </div>
            `;
            
            container.innerHTML = html;
            container.dataset.explorationMode = mode;
            renderExplorationTable(mode);
        }

        function toggleExplorationMode(mode) {
            const container = document.getElementById('viewContainer');
            container.dataset.explorationMode = mode;
            renderExplorationView(container);
        }

        function renderExplorationTable(mode) {
            const tableContainer = document.getElementById('explorationTable');
            console.log(fantasyData)
            const items = mode === 'drivers' ? fantasyData.drivers : fantasyData.constructors;
            const config = sortConfig[mode];
            
            const sortedItems = [...items].sort((a, b) => {
                const aVal = a[config.key];
                const bVal = b[config.key];
                const numA = Number(aVal);
                const numB = Number(bVal);
                
                let comparison = 0;
                if (!isNaN(numA) && !isNaN(numB)) {
                    comparison = numA > numB ? 1 : -1;
                } else {
                    comparison = String(aVal).localeCompare(String(bVal));
                }
                
                return config.direction === 'asc' ? comparison : -comparison;
            });

            const getSortIcon = (key) => {
                if (config.key !== key) {
                    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5 5 5-5M7 9l5-5 5 5"/></svg>';
                }
                if (config.direction === 'asc') {
                    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 15l5-5 5 5"/></svg>';
                }
                return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 9l5 5 5-5"/></svg>';
            };

            const rows = sortedItems.map(item => `
                <tr>
                    <td class="driver-name">${item.display_name}</td>
                    <td class="price text-right">${item.price ? Number(item.price).toFixed(1) + 'M' : 'N/A'}</td>
                    <td class="points text-right">${item.season_score}</td>
                </tr>
            `).join('');

            tableContainer.innerHTML = `
                <table>
                    <thead>
                        <tr>
                            <th>
                                <button onclick="sortExploration('display_name')" class="${config.key === 'display_name' ? 'sorted' : ''}">
                                    <span>Name</span>
                                    ${getSortIcon('display_name')}
                                </button>
                            </th>
                            <th class="text-right">
                                <button onclick="sortExploration('price')" class="${config.key === 'price' ? 'sorted' : ''}">
                                    <span>Latest Price</span>
                                    ${getSortIcon('price')}
                                </button>
                            </th>
                            <th class="text-right">
                                <button onclick="sortExploration('season_score')" class="${config.key === 'season_score' ? 'sorted' : ''}">
                                    <span>Avg Pts</span>
                                    ${getSortIcon('season_score')}
                                </button>
                            </th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function sortExploration(key) {
            const mode = document.getElementById('viewContainer').dataset.explorationMode || 'drivers';
            const config = sortConfig[mode];
            
            if (config.key === key) {
                config.direction = config.direction === 'asc' ? 'desc' : 'asc';
            } else {
                config.key = key;
                config.direction = 'asc';
            }
            
            renderExplorationTable(mode);
        }

        // Comparison View
        function renderComparisonView(container) {
            const mode = container.dataset.comparisonMode || 'drivers';
            const selection1 = container.dataset.selection1 || '';
            const selection2 = container.dataset.selection2 || '';
            
            const items = mode === 'drivers' ? fantasyData.drivers : fantasyData.constructors;
            const sortedItems = [...items].sort((a, b) => a.display_name.localeCompare(b.display_name));
            
            const options = sortedItems.map(item => 
                `<option value="${item.id}" ${item.id === selection1 || item.id === selection2 ? 'disabled' : ''}>${item.display_name}</option>`
            ).join('');

            const html = `
                <div class="card" style="padding: 1.5rem;">
                    <div class="comparison-header">
                        <h2 class="card-title">Compare ${mode === 'drivers' ? 'Drivers' : 'Constructors'}</h2>
                        <div class="mode-toggle">
                            <button class="mode-btn ${mode === 'drivers' ? 'active' : ''}" onclick="toggleComparisonMode('drivers')">Drivers</button>
                            <button class="mode-btn ${mode === 'constructors' ? 'active' : ''}" onclick="toggleComparisonMode('constructors')">Constructors</button>
                        </div>
                    </div>

                    <div class="selectors">
                        <div class="selector">
                            <label>Selection 1</label>
                            <select onchange="updateComparison(1, this.value)">
                                <option value="">Select...</option>
                                ${options}
                            </select>
                        </div>
                        <div class="selector">
                            <label>Selection 2</label>
                            <select onchange="updateComparison(2, this.value)">
                                <option value="">Select...</option>
                                ${options}
                            </select>
                        </div>
                    </div>

                    <div id="comparisonContent"></div>
                </div>
            `;
            
            container.innerHTML = html;
            container.dataset.comparisonMode = mode;
            container.dataset.selection1 = selection1;
            container.dataset.selection2 = selection2;
            
            if (selection1) {
                document.querySelector('.selector:first-child select').value = selection1;
            }
            if (selection2) {
                document.querySelector('.selector:last-child select').value = selection2;
            }
            
            renderComparisonContent();
        }

        function toggleComparisonMode(mode) {
            const container = document.getElementById('viewContainer');
            container.dataset.comparisonMode = mode;
            container.dataset.selection1 = '';
            container.dataset.selection2 = '';
            renderComparisonView(container);
        }

        function updateComparison(slot, value) {
            const container = document.getElementById('viewContainer');
            container.dataset[`selection${slot}`] = value;
            renderComparisonView(container);
        }

        function renderComparisonContent() {
            const container = document.getElementById('viewContainer');
            const mode = container.dataset.comparisonMode || 'drivers';
            const selection1 = container.dataset.selection1;
            const selection2 = container.dataset.selection2;
            const contentDiv = document.getElementById('comparisonContent');
            
            if (!selection1 || !selection2) {
                contentDiv.innerHTML = '<div class="empty-state"><p>Select two ' + mode + ' to begin comparison.</p></div>';
                return;
            }

            const items = mode === 'drivers' ? fantasyData.drivers : fantasyData.constructors;
            const item1 = items.find(i => i.id === selection1);
            const item2 = items.find(i => i.id === selection2);
            
            if (!item1 || !item2) return;

            const allRounds = new Set([...Object.keys(item1.scores_by_race), ...Object.keys(item2.scores_by_race)]);
            const sortedRounds = Array.from(allRounds).sort((a, b) => parseInt(a) - parseInt(b));
            
            const chartData = sortedRounds.map(round => ({
                round: `R${round}`,
                [item1.display_name]: parseInt(item1.scores_by_race[round] || '0'),
                [item2.display_name]: parseInt(item2.scores_by_race[round] || '0')
            }));

            contentDiv.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card">
                        <p class="label">Price</p>
                        <p class="value price">${Number(item1.price).toFixed(1)}M</p>
                    </div>
                    <div class="stat-card">
                        <p class="label">Total Points</p>
                        <p class="value">${item1.season_score}</p>
                    </div>
                    <div class="stat-card">
                        <p class="label">Price</p>
                        <p class="value price">${Number(item2.price).toFixed(1)}M</p>
                    </div>
                    <div class="stat-card">
                        <p class="label">Total Points</p>
                        <p class="value">${item2.season_score}</p>
                    </div>
                </div>

                <div class="chart-section">
                    <h3>Points per Race</h3>
                    <div class="chart-container">
                        <canvas id="comparisonChart"></canvas>
                    </div>
                </div>
            `;

            // Simple canvas chart
            setTimeout(() => drawChart(chartData, item1.display_name, item2.display_name), 100);
        }

        function drawChart(data, name1, name2) {
            const canvas = document.getElementById('comparisonChart');
            if (!canvas) return;
            
            const ctx = canvas.getContext('2d');
            const width = canvas.parentElement.clientWidth;
            const height = 320;
            canvas.width = width;
            canvas.height = height;

            const padding = { top: 20, right: 20, bottom: 40, left: 50 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;

            // Find max value
            const maxValue = Math.max(
                ...data.map(d => Math.max(d[name1] || 0, d[name2] || 0))
            );

            // Clear canvas
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(0, 0, width, height);

            // Draw grid
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + (chartHeight / 5) * i;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(width - padding.right, y);
                ctx.stroke();
            }

            // Draw axes labels
            ctx.fillStyle = '#94a3b8';
            ctx.font = '12px sans-serif';
            ctx.textAlign = 'right';
            for (let i = 0; i <= 5; i++) {
                const value = Math.round(maxValue - (maxValue / 5) * i);
                const y = padding.top + (chartHeight / 5) * i;
                ctx.fillText(value.toString(), padding.left - 10, y + 4);
            }

            // Draw lines
            const drawLine = (name, color) => {
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.beginPath();
                
                data.forEach((point, i) => {
                    const x = padding.left + (chartWidth / (data.length - 1)) * i;
                    const value = point[name] || 0;
                    const y = padding.top + chartHeight - (value / maxValue) * chartHeight;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                ctx.stroke();

                // Draw points
                ctx.fillStyle = color;
                data.forEach((point, i) => {
                    const x = padding.left + (chartWidth / (data.length - 1)) * i;
                    const value = point[name] || 0;
                    const y = padding.top + chartHeight - (value / maxValue) * chartHeight;
                    ctx.beginPath();
                    ctx.arc(x, y, 4, 0, Math.PI * 2);
                    ctx.fill();
                });
            };

            drawLine(name1, '#38bdf8');
            drawLine(name2, '#ED64A6');

            // Draw x-axis labels
            ctx.fillStyle = '#94a3b8';
            ctx.textAlign = 'center';
            data.forEach((point, i) => {
                if (i % 2 === 0) { // Show every other label
                    const x = padding.left + (chartWidth / (data.length - 1)) * i;
                    ctx.fillText(point.round, x, height - 20);
                }
            });

            // Draw legend
            ctx.textAlign = 'left';
            ctx.fillStyle = '#38bdf8';
            ctx.fillRect(padding.left, height - 15, 15, 3);
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText(name1, padding.left + 20, height - 10);
            
            const legendX = padding.left + 200;
            ctx.fillStyle = '#ED64A6';
            ctx.fillRect(legendX, height - 15, 15, 3);
            ctx.fillStyle = '#cbd5e1';
            ctx.fillText(name2, legendX + 20, height - 10);
        }

        // Prediction View
        function renderPredictionView(container) {
            container.innerHTML = `
                <div class="prediction-container">
                    <svg class="prediction-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6a1.5 1.5 0 11-3 0m3 0a1.5 1.5 0 10-3 0M3.75 6H7.5m3 12h9.75m-9.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-3.75 0H7.5m9-6h3.75m-3.75 0a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m-9.75 0h9.75" />
                    </svg>
                    <h2>AI Predictions Coming Soon!</h2>
                    <p>Our advanced AI model is in the workshop, getting tuned up to provide you with the best fantasy team predictions. Check back soon for data-driven team suggestions based on your budget.</p>
                </div>
            `;
        }
    </script>
</body>
